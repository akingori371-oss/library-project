{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<main class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-dark-blue-light/80 dark:bg-dark-blue-light/80 backdrop-blur-md rounded-2xl shadow-2xl border border-white/10 dark:border-white/10 p-8 transition-all">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="mx-auto w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center mb-4 shadow-lg">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
        </div>
        <h2 class="text-3xl font-bold text-white dark:text-white">Welcome back</h2>
        <p class="text-gray-300 dark:text-gray-300 mt-2">Sign in to your account</p>
      </div>

      <!-- Login form -->
      <form method="post" action="{% url 'login' %}" class="space-y-5">
        {% csrf_token %}
        
        <!-- Username field -->
        <div>
          <label for="id_username" class="block text-sm font-medium text-gray-200 dark:text-gray-200 mb-1">Username</label>
          <input type="text" name="username" id="id_username" autocomplete="username" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 text-white dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- Password field -->
        <div>
          <label for="id_password" class="block text-sm font-medium text-gray-200 dark:text-gray-200 mb-1">Password</label>
          <input type="password" name="password" id="id_password" autocomplete="current-password" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 text-white dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- Forgot password link -->
        <div class="flex justify-end">
          <a href="#" class="text-sm text-blue-300 hover:text-blue-200 transition">Forgot password?</a>
        </div>

        <!-- Submit button -->
        <button type="submit" 
                class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold shadow-lg transition-all transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-dark-blue">
          Sign In
        </button>
      </form>

      <!-- Register link -->
      <p class="mt-8 text-center text-sm text-gray-400 dark:text-gray-400">
        Don't have an account? 
        <a href="{% url 'register' %}" class="text-blue-300 hover:text-blue-200 font-medium transition">Create one</a>
      </p>
    </div>
  </div>
</main>
{% endblock %}
