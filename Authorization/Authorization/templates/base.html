<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}City Library{% endblock %}</title>
  <!-- Tailwind via CDN + custom theme extension -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'dark-blue': '#0a192f',      // deep navy
            'dark-blue-light': '#112240',
            'dark-blue-lighter': '#1e3a5f',
          }
        }
      }
    }
  </script>
  <style>
    /* smooth transition for theme change */
    body, .theme-transition {
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
  </style>
</head>
<body class="bg-white text-gray-900 dark:bg-dark-blue dark:text-gray-100 transition-colors duration-200">
  <!-- Theme toggle button (fixed top-right) -->
  <div class="fixed top-4 right-4 z-50">
    <button id="theme-toggle" class="p-2 rounded-full bg-dark-blue-light/80 dark:bg-white/20 backdrop-blur-sm border border-white/20 text-white dark:text-gray-800 hover:scale-110 transition shadow-lg">
      <!-- Sun icon (shown in dark mode) -->
      <svg id="theme-toggle-sun" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg id="theme-toggle-moon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </div>

  <!-- Main content block -->
  {% block content %}
  <main class="min-h-screen flex items-center justify-center px-6">
    <div class="max-w-2xl text-center">
      <h1 class="text-4xl md:text-6xl font-extrabold leading-tight">
        Welcome to <span class="text-blue-500">City Library</span>
      </h1>
      <p class="mt-6 text-lg text-gray-600 dark:text-gray-300">
        Browse thousands of books, borrow with a single click, and manage
        your loans from one simple dashboard.
      </p>
      <div class="mt-10 flex flex-wrap justify-center gap-4">
        <a href="{% url 'register' %}"
           class="px-6 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-500 transition">
          Get a library card
        </a>
        <a href="{% url 'login' %}"
           class="px-6 py-3 rounded-lg border border-gray-300 dark:border-white/30 font-semibold
                  hover:bg-gray-100 dark:hover:bg-white/10 transition">
 {%endblock%}
