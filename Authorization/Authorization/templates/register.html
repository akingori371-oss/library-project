{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<main class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-dark-blue-light/80 dark:bg-dark-blue-light/80 backdrop-blur-md rounded-2xl shadow-2xl border border-white/10 dark:border-white/10 p-8 transition-all">
      
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="mx-auto w-14 h-14 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center mb-4 shadow-lg">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
        <h2 class="text-3xl font-bold text-white dark:text-white">Create account</h2>
        <p class="text-gray-300 dark:text-gray-300 mt-2">Join us today</p>
      </div>

      <!-- Registration form -->
      <form method="post" action="{% url 'register' %}" class="space-y-5">
        {% csrf_token %}
        
        <!-- Username -->
        <div>
          <label for="id_username" class="block text-sm font-medium text-gray-200 dark:text-gray-200 mb-1">Username</label>
          <input type="text" name="username" id="id_username" autocomplete="username" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 text-white dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- Email -->
        <div>
          <label for="id_email" class="block text-sm font-medium text-gray-200 dark:text-gray-200 mb-1">Email</label>
          <input type="email" name="email" id="id_email" autocomplete="email" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 text-white dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- Password -->
        <div>
          <label for="id_password1" class="block text-sm font-medium text-gray-200 dark:text-gray-200 mb-1">Password</label>
          <input type="password" name="password1" id="id_password1" autocomplete="new-password" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 text-white dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="id_password2" class="block text-sm font-medium text-gray-200 dark:text-gray-200 mb-1">Confirm Password</label>
          <input type="password" name="password2" id="id_password2" autocomplete="new-password" required
                 class="w-full px-4 py-3 rounded-xl bg-white/5 dark:bg-white/5 border border-white/10 dark:border-white/10 text-white dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
        </div>

        <!-- Terms (optional) -->
        <div class="flex items-center">
          <input type="checkbox" id="terms" name="terms" required
                 class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 bg-white/5 dark:bg-white/5">
          <label for="terms" class="ml-2 text-sm text-gray-300 dark:text-gray-300">
            I agree to the <a href="#" class="text-blue-300 hover:text-blue-200">Terms of Service</a>
          </label>
        </div>

        <!-- Submit button -->
        <button type="submit" 
                class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold shadow-lg transition-all transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-dark-blue">
          Sign Up
        </button>
      </form>

      <!-- Login link -->
      <p class="mt-8 text-center text-sm text-gray-400 dark:text-gray-400">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-blue-300 hover:text-blue-200 font-medium transition">Sign in</a>
      </p>
    </div>
  </div>
</main>
{% endblock %}
